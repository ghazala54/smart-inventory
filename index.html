<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توقع أسعار المنازل بالذكاء الاصطناعي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            grid-column: span 2;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #e9ecef;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏠 التنبؤ بسعر المنزل</h2>
    <form id="predictionForm">
        <div class="grid">
            <div class="form-group">
                <label>متوسط دخل السكان (بالآلاف):</label>
                <input type="number" step="0.1" id="MedInc" value="3.5" required>
            </div>
            <div class="form-group">
                <label>عمر المنزل (سنوات):</label>
                <input type="number" id="HouseAge" value="25" required>
            </div>
            <div class="form-group">
                <label>متوسط عدد الغرف:</label>
                <input type="number" step="0.1" id="AveRooms" value="5.2" required>
            </div>
            <div class="form-group">
                <label>متوسط عدد غرف النوم:</label>
                <input type="number" step="0.1" id="AveBedrms" value="1.1" required>
            </div>
            <div class="form-group">
                <label>عدد السكان بالمنطقة:</label>
                <input type="number" id="Population" value="1200" required>
            </div>
            <div class="form-group">
                <label>متوسط أفراد الأسرة:</label>
                <input type="number" step="0.1" id="AveOccup" value="3.0" required>
            </div>
            <div class="form-group">
                <label>خط العرض (Latitude):</label>
                <input type="number" step="0.01" id="Latitude" value="34.05" required>
            </div>
            <div class="form-group">
                <label>خط الطول (Longitude):</label>
                <input type="number" step="0.01" id="Longitude" value="-118.25" required>
            </div>
            <button type="button" onclick="makePrediction()">توقع السعر الآن 🚀</button>
        </div>
    </form>

    <div id="result" class="result-box"></div>
</div>

<script>
    async function makePrediction() {
        const data = {
            MedInc: parseFloat(document.getElementById('MedInc').value),
            HouseAge: parseFloat(document.getElementById('HouseAge').value),
            AveRooms: parseFloat(document.getElementById('AveRooms').value),
            AveBedrms: parseFloat(document.getElementById('AveBedrms').value),
            Population: parseFloat(document.getElementById('Population').value),
            AveOccup: parseFloat(document.getElementById('AveOccup').value),
            Latitude: parseFloat(document.getElementById('Latitude').value),
            Longitude: parseFloat(document.getElementById('Longitude').value)
        };

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.innerText = 'جاري التنسيق مع الـ Backend...';

        try {
            const response = await fetch('http://127.0.0.1:8000/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            resultDiv.innerText = `💵 السعر المتوقع للمنزل: $${result.predicted_price.toLocaleString()} دولار`;
        } catch (error) {
            resultDiv.innerText = '❌ حدث خطأ في الاتصال بالخادم (Backend)!';
            console.error(error);
        }
    }
</script>

</body>
</html>
